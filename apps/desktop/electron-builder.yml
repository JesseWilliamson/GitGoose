# Packaging. `pnpm dist` builds installers for the current OS into apps/desktop/release/.
# Signing and notarization read credentials from the environment (see docs/RELEASING.md);
# without them, builds are unsigned, which is fine for local use.
appId: dev.gitgoose.app
productName: GitGoose
copyright: Copyright © 2026 Jesse Williamson
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The window icon on Linux and Windows (main/index.ts reads it from resources/).
extraResources:
  - from: build/icon.png
    to: icon.png
  # The tree-sitter grammars (WASM) and their queries, laid out by scripts/grammars.mjs.
  - from: out/grammars
    to: grammars
# @parcel/watcher ships a native .node binary, which cannot be loaded from inside the asar archive;
# web-tree-sitter reads its runtime .wasm with fs, which is faster from a real file too.
asarUnpack:
  - '**/node_modules/@parcel/watcher*/**'
  - '**/node_modules/web-tree-sitter/**'
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: false
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: gitgoose
  target: [AppImage]
  category: Development
  maintainer: Jesse Williamson
  # Name the .desktop entry after package.json's desktopName so its StartupWMClass matches
  # the app_id Electron reports, and window managers group running windows with the launcher.
  syncDesktopName: true
publish:
  provider: github
  owner: JesseWilliamson
  repo: GitSquidElectron
