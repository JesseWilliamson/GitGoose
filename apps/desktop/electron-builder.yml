# Packaging. `pnpm dist` builds installers for the current OS into apps/desktop/release/.
# Signing and notarization read credentials from the environment (see docs/RELEASING.md);
# without them, builds are unsigned, which is fine for local use.
appId: dev.gitsquid.app
productName: GitSquid
copyright: Copyright © 2026 Jesse Williamson
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# @parcel/watcher ships a native .node binary, which cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/node_modules/@parcel/watcher*/**'
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: false
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: gitsquid
  target: [AppImage, deb]
  category: Development
  maintainer: Jesse Williamson
  # Name the .desktop entry after package.json's desktopName so its StartupWMClass matches
  # the app_id Electron reports, and window managers group running windows with the launcher.
  syncDesktopName: true
deb:
  # The workspace package is @gitsquid/desktop, which is not a legal deb package name and
  # would put a "@gitsquid" directory in release/. Both are spelled out here instead.
  packageName: gitsquid
  artifactName: gitsquid_${version}_${arch}.${ext}
publish:
  provider: github
  owner: JesseWilliamson
  repo: GitSquidElectron
