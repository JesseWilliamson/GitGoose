name: Deploy the website to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Without the install scripts: the site does not need the Electron download.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck and build the site
        working-directory: apps/site
        run: |
          pnpm typecheck
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
