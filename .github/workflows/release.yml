name: Release

# Builds the installers on all three OSes and attaches them to the GitHub release. Either way of
# releasing works, and the tag may be v1.2.3 or 1.2.3:
#   - push a tag: this creates a draft release, fills it, and you publish it after a look;
#   - publish a release from the GitHub UI: the installers are added to it a few minutes later.
# Once published, electron-updater in installed copies offers the new version.
#
# Pull requests that touch packaging build the installers without publishing, and so does running
# this by hand (Actions → Release → Run workflow): download them from the run's artifacts.
on:
  push:
    tags: ['v*', '[0-9]*']
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - apps/desktop/build/**
  workflow_dispatch:

# Publishing a release from the UI with a new tag can start a tag push run and a release run for
# the same tag, and publishing a draft this workflow filled starts a release run too. One at a
# time: the later run finds the installers there and builds nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # For both tag pushes and release events, github.ref is refs/tags/<tag>.
    if: startsWith(github.ref, 'refs/tags/')
    # Only runs gh: the smallest runner is plenty.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      complete: ${{ steps.existing.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
      # electron-updater compares the version inside the app with the release's, so a release
      # tagged differently from the version it contains would be offered forever, or never.
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in apps/desktop/package.json (bump it, commit, and tag that commit)"
            exit 1
          fi
      # One job creates the release (a draft, after a tag push) and the three builds upload to it.
      # Were each build to create it, they would race and could leave three drafts.
      - name: Create the draft release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "GitGoose ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
      # Each OS uploads its own latest*.yml last, so all three there means a run already finished.
      - name: Check for installers already attached
        id: existing
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            grep -qx "$f" <<< "$names" || { echo complete=false >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo "Installers for all three OSes are already attached; nothing to build."
          echo complete=true >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: release
    # release is skipped for pull requests and manual runs; build anyway, but not after it failed.
    if: ${{ !failure() && !cancelled() && needs.release.outputs.complete != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        run: |
          pnpm build:dist
          # electron-builder only builds; the next step uploads. Its own publishing skips a release
          # that is already published ("existing type not compatible with publishing type"),
          # which is exactly the release a UI publish hands us.
          args=(--publish never)
          # Without a Developer ID certificate, sign ad-hoc. Unsigned, the app keeps the signature
          # electron-builder's edits broke, and macOS calls a downloaded copy "damaged" with no way
          # to open it; ad-hoc signed, it is from an "unidentified developer" and can be allowed.
          # Hardened runtime would then reject Electron's own frameworks, so it goes too.
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          pnpm exec electron-builder "${args[@]}"
        env:
          # Optional signing. Leave the secrets unset for unsigned builds.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      # The blockmaps let electron-updater download only the changed parts of an update, and
      # latest*.yml goes last: it is what installed copies read, so it must not point at installers
      # that are not there yet.
      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop/release
        shell: bash
        run: |
          shopt -s nullglob
          installers=(*.dmg *.zip *.exe *.AppImage *.blockmap)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::No installers in apps/desktop/release"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${installers[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$GITHUB_REF_NAME" latest*.yml --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installers-${{ runner.os }}
          retention-days: 7
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
