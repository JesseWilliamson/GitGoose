name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # On demand too (there is no nightly: a quiet day costs nothing).
  workflow_dispatch:

# Jobs run on Blacksmith runners (runs-on: blacksmith-*), not GitHub-hosted ones. The workflows
# are unchanged otherwise: Blacksmith only supplies the machines, and its cache sits behind the
# standard actions/cache and actions/setup-node. The Linux runners match ubuntu-latest's 4 vCPUs so
# the bench budgets keep meaning the same thing. Windows is in public beta there; macOS costs
# 20 Linux minutes a minute, so it stays off the per-change path (see e2e-desktop.yml).
# If a job queues forever, the Blacksmith GitHub App is not installed on this repository.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # End-to-end on Linux only: macOS and Windows run it on demand (e2e-desktop.yml),
      # since process starts there make the suite several times slower.
      - name: End-to-end (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ runner.os }}
          path: apps/desktop/test-results/

  bench:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Benchmark 100k commits against the budgets
        run: xvfb-run -a pnpm bench --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results/
